name: Python CI Test

on:
  push:
    branches:
      - main  # Trigger the workflow when there is a push to the main branch

jobs:
  test:
    runs-on: ubuntu-latest  # This will run the job on the latest Ubuntu runner

    steps:
      - name: Check out code
        uses: actions/checkout@v3  # Check out the code from the repository

      - name: Set up Python 3.9
        uses: actions/setup-python@v4  # Set up Python 3.9
        with:
          python-version: 3.9

      - name: Run tests
        run: |
          python -m unittest discover -s . -p "test_*.py"  # Run all test files that start with 'test_'
