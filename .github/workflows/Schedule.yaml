name: Daily_Scheduled_Build

on:
  schedule:
    - cron: '0 0 * * *'  

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Check out code
        uses: actions/checkout@v3  

      - name: Print message
        run: |
          echo "Scheduled build completed successfully!"  # Print the message in the logs
